name: Sync signatures from Latite

# Glacier's signature table is version-locked to a Minecraft build. Latite is
# actively maintained and updates its table when the game moves, so this job
# watches upstream and opens a PR when anything we import has changed.
#
# It deliberately opens a PR rather than pushing to master. Signature changes
# steer memory reads inside another process — a wrong one crashes the game or,
# worse, silently reads the wrong field. That warrants a human looking at the
# diff, and the PR build proves it still compiles before anyone merges.

on:
  schedule:
    # Daily. Bedrock updates are far less frequent, but the job is cheap and
    # catching a change the day it lands beats finding out when a user reports
    # that Fullbright stopped working.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream git ref to read (default: master)"
        required: false
        default: "master"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate signature table
        id: sync
        run: |
          set -o pipefail
          python tools/sync_signatures.py --ref "${{ inputs.ref || 'master' }}" 2>&1 | tee sync.log
        # Exit 3 means upstream renamed something in our mapping. That is a real
        # problem needing a human, so let the job fail loudly rather than
        # quietly producing no PR.

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/memory/Signatures.cpp; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No signature changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/memory/Signatures.cpp
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/sync-signatures
          # Reuse one branch so repeated runs update the same PR instead of
          # opening a new one every day the table is out of date.
          delete-branch: true
          title: "chore: sync signatures from Latite"
          commit-message: |
            chore: sync signatures from Latite

            Regenerated by tools/sync_signatures.py. Imported data only; see
            docs/acknowledgements.md for why this file is the one carrying
            third-party-derived values.
          labels: signatures
          body: |
            Automated regeneration of `src/memory/Signatures.cpp` from
            [Latite](https://github.com/LatiteClient/Latite) (GPLv3).

            **Before merging, check:**

            - [ ] The CI build on this PR is green.
            - [ ] Whether the target build in `SignatureManager::kTarget*` and
                  `docs/signatures.md` still says the right Minecraft version —
                  a signature change usually means the game moved.
            - [ ] Whether any offset moved in a way that affects code outside
                  this file (e.g. a field changing type or meaning, not just
                  address).

            **This is not verification.** A green build proves it compiles, not
            that the values are right for your game build. Entries stay marked
            ⚠️ inherited in `docs/signatures.md` until someone injects and
            confirms them against a running client.

            <details><summary>Sync log</summary>

            ```
            ${{ steps.sync.outputs.log }}
            ```
            </details>
