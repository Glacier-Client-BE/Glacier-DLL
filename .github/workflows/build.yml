name: Build Glacier DLL

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish release assets on tag builds

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  # Ultralight no longer offers an unauthenticated packaged-SDK download, so we
  # fetch the four pinned component archives its own CMake build uses. These
  # revisions match the v1.3.0 / v1.4.0-beta C++ API our code targets.
  UL_CORE_REV: "41a04e01"
  UL_WEBCORE_REV: "e9fa2251"
  UL_ULTRALIGHT_REV: "561bd7be"
  UL_APPCORE_REV: "5f88113"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchain ──────────────────────────────────────────────────────────
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ── Dependencies: vcpkg (MinHook) ──────────────────────────────────────
      # windows-latest ships a bootstrapped vcpkg at $VCPKG_INSTALLATION_ROOT.
      # Manifest mode reads vcpkg.json and installs MinHook during the build.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg dependencies
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md
        shell: pwsh

      # ── Dependencies: Ultralight SDK (assembled from component archives) ──
      - name: Cache Ultralight SDK
        id: cache-ul
        uses: actions/cache@v4
        with:
          path: third_party/ultralight
          key: ultralight-${{ env.UL_CORE_REV }}-${{ env.UL_WEBCORE_REV }}-${{ env.UL_ULTRALIGHT_REV }}-${{ env.UL_APPCORE_REV }}-win-x64

      - name: Download & assemble Ultralight SDK
        if: steps.cache-ul.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $domain = ".sfo2.cdn.digitaloceanspaces.com"
          $components = [ordered]@{
            "ultralightcore-bin" = "${{ env.UL_CORE_REV }}"   # base types + platform/ headers + Config.h
            "webcore-bin"        = "${{ env.UL_WEBCORE_REV }}" # WebCore.dll + bin/resources (icudt, cacert)
            "ultralight-bin"     = "${{ env.UL_ULTRALIGHT_REV }}"
            "appcore-bin"        = "${{ env.UL_APPCORE_REV }}"
          }
          $sdk = "third_party/ultralight"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          foreach ($name in $components.Keys) {
            $rev = $components[$name]
            $url = "https://$name$domain/$name-$rev-win-x64.7z"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile "$name.7z"
            # All four archives share the include/ lib/ bin/ layout and merge cleanly.
            7z x "$name.7z" -o"$sdk" -y | Out-Null
          }
          Write-Host "Assembled SDK libs:"
          Get-ChildItem "$sdk/lib" | Select-Object -ExpandProperty Name
        shell: pwsh

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build Glacier.dll
        run: |
          msbuild Glacier.sln `
            /m `
            /p:Configuration=$env:BUILD_CONFIGURATION `
            /p:Platform=$env:BUILD_PLATFORM `
            /p:VcpkgEnableManifest=true
        shell: pwsh

      # ── Package: dll + Ultralight runtime (dlls + resources) + web UI ─────
      - name: Stage release package
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out, "$out/assets" | Out-Null
          Copy-Item "build/x64/Release/Glacier.dll" $out
          # Ultralight runtime DLLs + its resources/ folder (icudt67l.dat, cacert.pem).
          Copy-Item "third_party/ultralight/bin/*.dll" $out
          Copy-Item -Recurse "third_party/ultralight/bin/resources" "$out/resources"
          # The HTML/CSS/JS the DLL loads, including the bundled FontAwesome kit.
          Copy-Item "web/*" "$out/assets" -Recurse
          Write-Host "Package contents:"; Get-ChildItem $out | Select-Object -ExpandProperty Name

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glacier-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}
          path: dist/**
          if-no-files-found: error

      # ── Publish a GitHub Release on version tags ──────────────────────────
      - name: Zip release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/* -DestinationPath "Glacier-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Glacier-${{ github.ref_name }}.zip
            dist/Glacier.dll
          generate_release_notes: true
