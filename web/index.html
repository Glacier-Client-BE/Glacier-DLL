<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glacier</title>

    <!-- FontAwesome. Bundle the kit locally under ./assets for offline use; the
         CDN link is the dev fallback. Ultralight serves ./assets via the file
         system set in UIRenderer. -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ───────── Always-on HUD ─────────
         Driven by window.glacier.onHud(payload), pushed from C++ ~15×/sec.
         pointer-events: none so it never steals clicks from the game. -->
    <div class="hud-layer" id="hud">
        <div class="hud-corner tl" id="hud-tl"></div>
        <div class="hud-corner tr" id="hud-tr"></div>
        <div class="hud-corner bl" id="hud-bl"></div>
        <div class="hud-corner br" id="hud-br"></div>
        <div class="hud-free" id="hud-free"></div>
    </div>

    <!-- ───────── Click GUI ─────────
         Hidden until C++ calls window.glacier.setMenuVisible(true). The HUD
         keeps rendering underneath while this is open. -->
    <div class="glacier-menu" id="menu" hidden>
        <div class="glacier-root" id="root">
            <aside class="sidebar">
                <div class="brand">
                    <div class="brand-logo"><i class="fa-solid fa-snowflake"></i></div>
                    <div class="brand-text">
                        <span class="brand-title">Glacier</span>
                        <span class="brand-sub">Bedrock Client</span>
                    </div>
                </div>

                <nav class="nav" id="nav">
                    <!-- Category buttons injected by main.js -->
                </nav>

                <div class="sidebar-footer">
                    <button class="ghost-btn" id="closeBtn" data-tooltip="Close (ESC)">
                        <i class="fa-solid fa-xmark"></i><span>Close</span>
                    </button>
                </div>
            </aside>

            <main class="content">
                <header class="content-header">
                    <div class="header-title">
                        <h1 id="categoryTitle">Combat</h1>
                        <div class="title-underline"></div>
                    </div>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search" placeholder="Search modules…" autocomplete="off" />
                    </div>
                </header>

                <section class="module-grid" id="modules">
                    <!-- Module cards injected by main.js -->
                </section>

                <div class="empty-state" id="emptyState" hidden>
                    <i class="fa-solid fa-wind"></i>
                    <span>No modules match your search</span>
                    <small>Try a different category or clear the filter.</small>
                </div>
            </main>
        </div>
    </div>

    <div class="toast-host" id="toastHost"></div>

    <script src="main.js"></script>
</body>
</html>
